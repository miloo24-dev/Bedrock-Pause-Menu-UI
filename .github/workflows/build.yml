name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bedrock-pause-menu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
          build-root-directory: bedrock-pause-menu

      - name: Build
        run: gradle clean build --no-daemon --stacktrace

      - name: Daftar jar hasil build
        run: ls -la build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-pause-menu-${{ github.run_number }}
          path: |
            bedrock-pause-menu/build/libs/*.jar
            !bedrock-pause-menu/build/libs/*-sources.jar
